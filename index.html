<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星夜之下｜網黃天團模擬器</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --accent: #8b5cf6;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f43f5e;
      --success: #10b981;
      --fan: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .panel {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat {
      background: #252530;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
    .stat-value { font-size: 1.2rem; font-weight: 600; }
    .characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .char-card {
      background: #252530;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .char-card:hover { background: #2e2e3a; }
    .char-name { font-weight: 600; margin-bottom: 4px; }
    .bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin: 4px 0;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; }
    .aff { background: var(--accent); }
    .jel { background: var(--danger); }
    .story {
      min-height: 220px;
      white-space: pre-wrap;
      margin-bottom: 16px;
      line-height: 1.7;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      background: #252530;
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.secondary { background: #333; }
    button.fan { background: var(--fan); }
    button:hover { opacity: 0.9; }
    .log {
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>星夜之下</h1>
    <div class="subtitle">網黃天團 × 多角色戀愛模擬器</div>

    <div class="panel">
      <div class="status-grid">
        <div class="stat">
          <div class="stat-label">宋黎年齡</div>
          <div class="stat-value">19</div>
        </div>
        <div class="stat">
          <div class="stat-label">工作聲望</div>
          <div class="stat-value" id="rep">45</div>
        </div>
        <div class="stat">
          <div class="stat-label">目前時間</div>
          <div class="stat-value" id="time">深夜</div>
        </div>
        <div class="stat">
          <div class="stat-label">地點</div>
          <div class="stat-value" id="loc">家中客廳</div>
        </div>
      </div>
      <div class="characters" id="charList"></div>
    </div>

    <div class="panel">
      <div class="story" id="story"></div>

      <div class="actions" id="quickActions">
        <button onclick="doAction('看向權時赫')">看向權時赫</button>
        <button onclick="doAction('拿手機滑社群')">滑社群</button>
        <button onclick="doAction('故意講幹話')">搞怪一下</button>
        <button class="fan" onclick="showFanMenu()">粉絲互動</button>
      </div>

      <div class="actions hidden" id="fanMenu">
        <button class="fan" onclick="doAction('溫柔回覆粉絲留言')">溫柔回覆留言</button>
        <button class="fan" onclick="doAction('搞怪回覆粉絲')">搞怪回覆</button>
        <button class="fan" onclick="doAction('開一場臨時直播')">開臨時直播</button>
        <button class="fan" onclick="doAction('拒絕付費私訊')">拒絕付費私訊</button>
        <button class="secondary" onclick="hideFanMenu()">返回</button>
      </div>

      <textarea id="input" placeholder="輸入宋黎現在要做的事或說的話..."></textarea>
      <div class="actions">
        <button onclick="submitInput()">送出行動</button>
        <button class="secondary" onclick="saveGame()">儲存進度</button>
        <button class="secondary" onclick="loadGame()">讀取進度</button>
        <button class="secondary" onclick="restart()">重新開始</button>
      </div>
    </div>

    <div class="panel">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:8px;">近期紀錄</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const chars = {
      kwon: { name: "權時赫", age: 31, aff: 35, jel: 5, desc: "沉著理性，目前與你同住。當初因為覺得你可憐才把你帶回來。" },
      lee:  { name: "李俊延", age: 28, aff: 15, jel: 0, desc: "氣場強勢，做事果斷，重視掌控感。" },
      seo:  { name: "徐道賢", age: 30, aff: 15, jel: 0, desc: "溫和細心，擅長聆聽，常注意到別人沒說出口的情緒。" },
      kang: { name: "姜泰伍", age: 29, aff: 15, jel: 0, desc: "擅長交際，說話帶著玩笑，習慣用輕鬆方式試探距離。" },
      han:  { name: "韓珉奎", age: 27, aff: 15, jel: 0, desc: "坦率自信，喜歡把話說清楚，不擅長拐彎抹角。" }
    };

    let state = {
      rep: 45,
      time: "深夜",
      loc: "家中客廳",
      story: "",
      log: []
    };

    const randomEvents = [
      {
        condition: () => true,
        weight: 10,
        run: () => {
          state.story += `\n\n【突發事件】\n手機突然震動，是平台傳來的通知：有粉絲在你的最新動態下吵了起來，正在tag你希望你出面處理。`;
          addLog("突發：粉絲爭議");
        }
      },
      {
        condition: () => chars.kwon.jel >= 15,
        weight: 9,
        run: () => {
          chars.kwon.jel = Math.min(100, chars.kwon.jel + 6);
          state.story += `\n\n【突發事件】\n權時赫走過來，把你的手機螢幕按暗。\n「今晚先別回了。」他的語氣聽起來很平靜，但你感覺得出來他有點不高興。`;
          addLog("突發：權時赫干涉粉絲互動");
        }
      },
      {
        condition: () => state.rep >= 48,
        weight: 8,
        run: () => {
          state.rep = Math.min(100, state.rep + 4);
          state.story += `\n\n【突發事件】\n你的一名忠實粉絲在社群發了長文支持你，短時間內被轉發了不少。聲望再次上升。`;
          addLog("突發：粉絲寫長文支持");
        }
      },
      {
        condition: () => true,
        weight: 7,
        run: () => {
          state.story += `\n\n【突發事件】\n姜泰伍突然傳訊息來：「你是不是又在搞怪回粉絲？我剛剛刷到了，笑死。」\n後面還跟了一堆表情符號。`;
          chars.kang.aff = Math.min(100, chars.kang.aff + 3);
          addLog("突發：姜泰伍傳訊");
        }
      },
      {
        condition: () => chars.kwon.aff >= 38,
        weight: 6,
        run: () => {
          state.story += `\n\n【突發事件】\n權時赫把一件乾淨的毛巾丟到你頭上。\n「頭髮擦一下，別坐在沙發上滴水。」\n說完他就轉身回房間了，但腳步比平時慢了一點。`;
          chars.kwon.aff = Math.min(100, chars.kwon.aff + 2);
          addLog("突發：權時赫丟毛巾");
        }
      },
      {
        condition: () => true,
        weight: 5,
        run: () => {
          state.story += `\n\n【突發事件】\n外面突然下起了很大的雨。雨打在窗上的聲音讓客廳安靜了幾秒。\n權時赫看了一眼窗戶，沒說話。`;
          addLog("突發：突然下雨");
        }
      },
      {
        condition: () => state.rep >= 55,
        weight: 4,
        run: () => {
          state.story += `\n\n【突發事件】\n李俊延在群組裡傳了一句：「最近聲量不錯，有空可以聊聊合作。」\n訊息 ethereal 很簡短，但你知道他很少主動提這種事。`;
          chars.lee.aff = Math.min(100, chars.lee.aff + 4);
          addLog("突發：李俊延提及合作");
        }
      },
      {
        condition: () => true,
        weight: 3,
        run: () => {
          state.story += `\n\n【突發事件】\n徐道賢傳了一則訊息：「今天還好嗎？記得吃飯。」\n附帶一個很簡單的貼圖。`;
          chars.seo.aff = Math.min(100, chars.seo.aff + 3);
          addLog("突發：徐道賢關心");
        }
      }
    ];

    function tryRandomEvent() {
      if (Math.random() > 0.20) return;
      const possible = randomEvents.filter(e => e.condition());
      if (possible.length === 0) return;
      const totalWeight = possible.reduce((sum, e) => sum + e.weight, 0);
      let rand = Math.random() * totalWeight;
      let selected = possible[0];
      for (const e of possible) {
        rand -= e.weight;
        if (rand <= 0) {
          selected = e;
          break;
        }
      }
      selected.run();
    }

    function init() {
      state.story = `夜已經很深了。

客廳只開著一盞落地燈，光線偏暖。你剛洗完澡，頭髮還沒完全乾，就整個人窩在沙發上滑手機。

權時赫從房間走出來，手上拿著一杯水，看了你一眼，把水放在茶几上。

「還沒睡？」他的聲音一如既往的平靜。

你知道他其實不是真的在問你睡不睡，只是習慣確認你還在。`;
      render();
      addLog("遊戲開始");
    }

    function render() {
      document.getElementById("rep").textContent = state.rep;
      document.getElementById("time").textContent = state.time;
      document.getElementById("loc").textContent = state.loc;
      document.getElementById("story").textContent = state.story;

      const list = document.getElementById("charList");
      list.innerHTML = "";
      for (const [id, c] of Object.entries(chars)) {
        const div = document.createElement("div");
        div.className = "char-card";
        div.innerHTML = `
          <div class="char-name">${c.name}</div>
          <div style="font-size:0.75rem;color:#9ca3af">好感 ${c.aff}</div>
          <div class="bar"><div class="bar-fill aff" style="width:${c.aff}%"></div></div>
          <div style="font-size:0.75rem;color:#9ca3af">嫉妒 ${c.jel}</div>
          <div class="bar"><div class="bar-fill jel" style="width:${c.jel}%"></div></div>
        `;
        div.onclick = () => alert(`${c.name}（${c.age}歲）\n\n${c.desc}\n\n好感：${c.aff}\n嫉妒：${c.jel}`);
        list.appendChild(div);
      }
      document.getElementById("log").innerHTML = state.log.slice(-10).reverse().map(l => `<div>• ${l}</div>`).join("");
    }

    function processAction(text) {
      const t = text.toLowerCase();
      let response = "";
      let changed = false;

      if (t.includes("權時赫") || t.includes("時赫") || t.includes("看向他") || t.includes("看向權時赫")) {
        chars.kwon.aff = Math.min(100, chars.kwon.aff + 3);
        response = `權時赫沒有立刻說話，只是在你對面的單人沙發坐下，拿起遙控器卻沒打開電視。

「頭髮還在滴水。」他說，語氣聽起來像在陳述事實。

你知道他其實是在提醒你。`;
        changed = true;
      }
      else if (t.includes("搞怪") || t.includes("幹話") || t.includes("惡作劇") || t.includes("裝傻") || t.includes("故意講幹話")) {
        chars.kwon.aff = Math.min(100, chars.kwon.aff + 2);
        response = `你突然用很嚴肅的表情說了一句完全不著邊際的話。

權時赫愣了一下，然後輕輕嘆了口氣，嘴角卻有一點幾乎看不出來的弧度。

「……你今天精神不錯。」`;
        changed = true;
      }
      else if (t.includes("回覆") || t.includes("留言") || t.includes("粉絲")) {
        if (t.includes("搞怪")) {
          state.rep = Math.min(100, state.rep + 6);
          chars.kwon.jel = Math.min(100, chars.kwon.jel + 5);
          response = `你用一貫的搞怪風格回了幾則留言，粉絲瞬間暴動，私訊和留言速度明顯加快。

客廳另一頭，權時赫的視線在你手機螢幕上停了一秒。

他沒說什麼，只是把水杯又往你的方向推近了一點。`;
        } else {
          state.rep = Math.min(100, state.rep + 3);
          response = `你認真回覆了幾則粉絲留言，語氣溫柔但有分寸。聲望似乎又往上爬了一點。`;
        }
        changed = true;
      }
      else if (t.includes("直播")) {
        state.rep = Math.min(100, state.rep + 8);
        chars.kwon.jel = Math.min(100, chars.kwon.jel + 7);
        response = `你臨時決定開一場免費直播。

螢幕亮起的瞬間，在線人數爬升得比預期快。你用一貫的節奏跟粉絲聊天、開玩笑，偶爾故意講一些讓人哭笑不得的幹話。

直播結束後，你關掉手機，發現權時赫還坐在原來的位置。

「結束了？」他問。`;
        changed = true;
      }
      else if (t.includes("拒絕付費") || t.includes("拒絕私訊")) {
        state.rep = Math.min(100, state.rep + 2);
        chars.kwon.aff = Math.min(100, chars.kwon.aff + 2);
        response = `你拒絕了幾則付費私訊請求，並簡單回覆了自己的界線。

權時赫似乎注意到你的動作，雖然他沒有說什麼，但空氣中的感覺放鬆了一點。`;
        changed = true;
      }
      else if (t.includes("滑社群") || t.includes("滑手機")) {
        response = `你漫無目的地滑著社群，刷過一堆動態和影片。

偶爾看到有人討論你最近的內容，評論兩極，但整體還算正面。`;
        changed = true;
      }

      if (!changed) {
        response = `你做了「${text}」。

權時赫看了你一眼，沒有特別表示，只是把電視打開，聲音調得很小。

夜還很長。`;
        chars.kwon.aff = Math.min(100, chars.kwon.aff + 1);
      }

      state.story = response;
      addLog(text);
      tryRandomEvent();
      render();
    }

    function doAction(text) {
      document.getElementById("input").value = text;
      submitInput();
    }

    function submitInput() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      processAction(text);
      input.value = "";
      hideFanMenu();
    }

    function showFanMenu() {
      document.getElementById("quickActions").classList.add("hidden");
      document.getElementById("fanMenu").classList.remove("hidden");
    }
    function hideFanMenu() {
      document.getElementById("fanMenu").classList.add("hidden");
      document.getElementById("quickActions").classList.remove("hidden");
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
      state.log.push(`[${time}] ${msg}`);
    }

    function saveGame() {
      const data = { state, chars };
      localStorage.setItem("songli_sim_v2", JSON.stringify(data));
      addLog("進度已儲存");
      render();
      alert("進度已儲存");
    }
    function loadGame() {
      const raw = localStorage.getItem("songli_sim_v2");
      if (!raw) return alert("沒有存檔");
      const data = JSON.parse(raw);
      state = data.state;
      Object.assign(chars, data.chars);
      addLog("進度已讀取");
      render();
    }
    function restart() {
      if (confirm("確定要重新開始嗎？目前進度會消失。")) {
        location.reload();
      }
    }

    init();
  </script>
</body>
</html>
